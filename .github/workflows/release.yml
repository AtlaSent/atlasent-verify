name: release

# Builds the external `atlasent-audit-verify` CLI for every supported
# platform on every push to a release tag and uploads signed artifacts
# to a GitHub Release. Specified by ADR-020 § "Distribution & trust".
#
# Trigger:
#   git tag vX.Y.Z && git push --tags
#
# What this workflow does:
#   1. Builds a fully-static binary for each platform in the matrix.
#   2. Computes SHA-256 checksums for each artifact.
#   3. Signs each artifact + the checksum file with Sigstore Cosign
#      (keyless OIDC signing). Anyone can verify via:
#        cosign verify-blob \
#          --certificate-identity-regexp 'https://github.com/(?i:atlasent)/atlasent-verify/.*' \
#          --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#          --signature <artifact>.sig \
#          --certificate <artifact>.pem \
#          <artifact>
#   4. Publishes the artifacts + checksums + signatures + certs to a
#      GitHub Release tagged with the input tag.
#
# Reproducibility:
#   * -trimpath strips local paths.
#   * -buildid= removes the build ID.
#   * Version is stamped via -ldflags from the tag.
#   * No CGO; pure-Go static binaries.
#   * Same Go version pinned across the matrix.
#   The byte-identical-builds guarantee is **verified on every PR** by
#   .github/workflows/reproducibility.yml. If any change to the build
#   flags below regresses reproducibility, that workflow fails and the
#   PR cannot land. Build flags here and there MUST stay in sync.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Manual version label (e.g. v0.1.0-dev)'
        required: true

permissions:
  contents: write       # to create the GitHub Release + upload assets
  id-token: write       # to obtain the OIDC token for Sigstore keyless signing
  attestations: write   # to record GitHub build-provenance attestations (SLSA)

env:
  GO_VERSION: '1.24'

jobs:
  # ── AtlaSent release gate ──────────────────────────────────────────────
  # Dogfooding fix: this workflow builds, signs, and publishes releases of
  # the OFFLINE AUDIT-CHAIN VERIFIER ITSELF -- the tool a customer or
  # auditor runs, with no NDA and no network access, to independently check
  # that AtlaSent's own evidence chain hasn't been tampered with. It had no
  # AtlaSent evaluate/permit gate at all: any push of a vX.Y.Z tag published
  # a new signed release with zero authorization check. Found during a
  # dogfooding audit of consequential actions AtlaSent's own coding agents
  # can take against AtlaSent's own infrastructure. An unauthorized release
  # of this specific tool is a higher-trust-impact target than most: it's
  # the thing that's supposed to catch tampering, so its own supply chain
  # deserves the same gate everything else in this audit got.
  #
  # Uses package.release (this is a versioned binary release, not a
  # deployment), mirroring atlasent-action's own release.yml and
  # atlasent-sdk's proven npm/PyPI publish gates. Not cross-checked against
  # the actual seeded policy for whatever org this repo's key belongs to.
  #
  # Requires an ATLASENT_API_KEY secret (scopes evaluate:write,
  # verify:execute) on this workflow's GitHub Environment (or repo/org
  # secrets), or every real tag push fails at the gate step by design.
  # `build` depends on this job; `sign-and-release` depends on `build`, so
  # neither runs without a verified permit.
  gate:
    name: AtlaSent release gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v6
      - name: AtlaSent release gate
        id: atlasent_gate
        uses: Atlasent/atlasent-action@v1
        env:
          ATLASENT_API_KEY: ${{ secrets.ATLASENT_API_KEY }}
        with:
          action: package.release
          actor: ${{ github.actor }}
          environment: production
          api-url: https://kttccumlnmdtupgbyfue.supabase.co/functions/v1
          context: '{"ref": "${{ github.ref }}", "repo": "${{ github.repository }}", "artifact": "atlasent-audit-verify"}'

  build:
    name: build ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            ext: ''
          - os: linux
            arch: arm64
            ext: ''
          - os: darwin
            arch: amd64
            ext: ''
          - os: darwin
            arch: arm64
            ext: ''
          - os: windows
            arch: amd64
            ext: '.exe'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.mod

      - name: Derive version label
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "label=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            # Tag form: refs/tags/vX.Y.Z → vX.Y.Z
            echo "label=${GITHUB_REF##refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build static binary
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          out="atlasent-audit-verify-${{ steps.version.outputs.label }}-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}"
          go build \
            -trimpath \
            -buildvcs=false \
            -ldflags "-s -w -buildid= -X main.Version=${{ steps.version.outputs.label }}" \
            -o "dist/$out" \
            ./cmd/atlasent-audit-verify
          ls -la dist/

      - name: Compute SHA-256
        working-directory: dist
        run: |
          out="atlasent-audit-verify-${{ steps.version.outputs.label }}-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}"
          sha256sum "$out" | tee "$out.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/atlasent-audit-verify-*

  sign-and-release:
    name: Sign and publish release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6

      - name: Derive version label
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "label=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "label=${GITHUB_REF##refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: build-*
          merge-multiple: true

      - name: Aggregate checksums
        working-directory: dist
        run: |
          ls -la
          # Build the canonical CHECKSUMS.txt covering every binary.
          # Format matches `sha256sum -c` consumption.
          : > CHECKSUMS.txt
          for f in atlasent-audit-verify-*; do
            # Skip individual .sha256 files; we re-compute.
            case "$f" in
              *.sha256|*.sig|*.pem|CHECKSUMS.txt|CHECKSUMS.txt.sig|CHECKSUMS.txt.pem) continue ;;
            esac
            sha256sum "$f" >> CHECKSUMS.txt
          done
          cat CHECKSUMS.txt

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.0'

      - name: Sign each binary (keyless OIDC)
        working-directory: dist
        env:
          COSIGN_YES: 'true'
        run: |
          for f in atlasent-audit-verify-*; do
            case "$f" in
              *.sha256|*.sig|*.pem|CHECKSUMS.txt*) continue ;;
            esac
            echo "::group::Signing $f"
            cosign sign-blob \
              --output-signature "$f.sig" \
              --output-certificate "$f.pem" \
              "$f"
            echo "::endgroup::"
          done

      - name: Sign aggregate checksums
        working-directory: dist
        env:
          COSIGN_YES: 'true'
        run: |
          cosign sign-blob \
            --output-signature CHECKSUMS.txt.sig \
            --output-certificate CHECKSUMS.txt.pem \
            CHECKSUMS.txt

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/atlasent-audit-verify-${{ steps.version.outputs.label }}.sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Sign SBOM (keyless OIDC)
        working-directory: dist
        env:
          COSIGN_YES: 'true'
        run: |
          sbom="atlasent-audit-verify-${{ steps.version.outputs.label }}.sbom.cdx.json"
          cosign sign-blob \
            --output-signature "$sbom.sig" \
            --output-certificate "$sbom.pem" \
            "$sbom"

      - name: Attest build provenance (SLSA)
        # GitHub-native build provenance for each released binary. Records a
        # signed attestation in the repo's attestation store; verifiable with:
        #   gh attestation verify <binary> --repo Atlasent/atlasent-verify
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/atlasent-audit-verify-*-linux-amd64
            dist/atlasent-audit-verify-*-linux-arm64
            dist/atlasent-audit-verify-*-darwin-amd64
            dist/atlasent-audit-verify-*-darwin-arm64
            dist/atlasent-audit-verify-*-windows-amd64.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: atlasent-audit-verify ${{ steps.version.outputs.label }}
          # Use the already-derived version label, not github.ref_name, for
          # tag_name/prerelease/make_latest below. On a tag push the two are
          # identical (steps.version.outputs.label is computed FROM
          # github.ref_name in that branch), so this is a no-op for the
          # normal release path. On workflow_dispatch they diverge:
          # github.ref_name is whatever branch/tag was picked to dispatch
          # FROM (e.g. "main"), while steps.version.outputs.label is the
          # manually-typed inputs.version (e.g. "v0.1.0-dev"). Using
          # github.ref_name here would tag_name the release "main" while
          # its build labels, filenames, and release title all say
          # "v0.1.0-dev" -- a real, publishable mismatch for a tool whose
          # entire purpose is supply-chain integrity. Never actually fired
          # (zero workflow_dispatch runs of this workflow to date, confirmed
          # via the Actions API) but worth closing before it does.
          tag_name: ${{ steps.version.outputs.label }}
          # RC / pre-release tags (anything with a hyphen, e.g. v0.1.0-rc.1) are
          # published as pre-releases and are NOT marked "latest".
          prerelease: ${{ contains(steps.version.outputs.label, '-') }}
          make_latest: ${{ !contains(steps.version.outputs.label, '-') }}
          body: |
            The **offline, source-open AtlaSent audit-chain verifier** (ADR-020).
            Read-only: no network I/O, no database access, no developer tools or
            repository checkout required — download the binary for your platform
            and run it against an exported chain.

            **Source commit:** `${{ github.sha }}`
            **Canonical form supported:** audit chain v5.

            ## Usage
            ```
            # verify a chain export (hash continuity + ordering + canonical form)
            atlasent-audit-verify --chain chain.ndjson

            # strict acceptance for evidence: fail unless EVERY entry's signature
            # was verified against a known key (exit 0 proves 0 skipped)
            atlasent-audit-verify --chain chain.ndjson --keys keys.pem --require-signatures
            ```
            Exit codes: `0` = valid, `1` = findings (integrity failures), `2` = environment error.

            ## Verifying this download
            Each artifact is signed with Sigstore Cosign (keyless OIDC) and covered
            by a GitHub build-provenance attestation. A CycloneDX **SBOM** is
            included (`*.sbom.cdx.json`, signed).

            ```
            # 1) checksums
            sha256sum -c CHECKSUMS.txt
            # 2) Sigstore signature (per artifact, or the CHECKSUMS file once)
            cosign verify-blob \
              --certificate-identity-regexp 'https://github.com/(?i:atlasent)/atlasent-verify/.*' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --signature <artifact>.sig --certificate <artifact>.pem <artifact>
            # 3) GitHub build provenance
            gh attestation verify <artifact> --repo Atlasent/atlasent-verify
            ```
            Builds are byte-for-byte reproducible (verified on every PR by the
            reproducibility workflow).

            ## Windows note (transparency)
            The Windows `.exe` is **not** Authenticode code-signed (AtlaSent has no
            code-signing certificate for this initial release), so Windows SmartScreen
            may show an "unrecognized app" warning on first run. Its integrity is
            instead provable via the SHA-256 checksum, the Sigstore signature, and
            the GitHub provenance attestation above. A future release may add
            Authenticode signing.

            ## License & security
            License: see [`LICENSE`](https://github.com/Atlasent/atlasent-verify/blob/main/LICENSE).
            Report a vulnerability: [Security policy](https://github.com/Atlasent/atlasent-verify/blob/main/SECURITY.md)
            (private GitHub Security Advisories).
          fail_on_unmatched_files: true
          files: |
            dist/atlasent-audit-verify-*
            dist/CHECKSUMS.txt
            dist/CHECKSUMS.txt.sig
            dist/CHECKSUMS.txt.pem
